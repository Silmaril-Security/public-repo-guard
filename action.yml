name: Public repo guard
description: Blocks infrastructure endpoints, internal identifiers and customer names in new commits and pull request text.
inputs:
  customer-pattern:
    description: Case-insensitive regular expression of customer and tenant names, supplied from an Actions secret.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Scan new commits and pull request text
      shell: bash
      env:
        PUBLIC_REPO_GUARD_CUSTOMER_PATTERN: ${{ inputs.customer-pattern }}
      run: python3 "$GITHUB_ACTION_PATH/public_repo_guard.py" --workspace "$GITHUB_WORKSPACE" scan
