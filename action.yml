name: Public repo guard
description: Blocks infrastructure endpoints, internal identifiers, customer names and credentials in new commits and pull request text.
inputs:
  customer-pattern:
    description: Case-insensitive regular expression of customer and tenant names, supplied from an Actions secret.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - id: scan
      name: Scan new commits and pull request text
      shell: bash
      env:
        PUBLIC_REPO_GUARD_CUSTOMER_PATTERN: ${{ inputs.customer-pattern }}
      run: python3 "$GITHUB_ACTION_PATH/public_repo_guard.py" --workspace "$GITHUB_WORKSPACE" scan
    - name: Scan new commits for credentials with gitleaks
      if: ${{ !cancelled() && steps.scan.outputs.log-opts != '' }}
      shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        LOG_OPTS: ${{ steps.scan.outputs.log-opts }}
      run: |
        archive="$RUNNER_TEMP/gitleaks.tar.gz"
        curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
        tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
        "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 --log-opts="$LOG_OPTS" "$GITHUB_WORKSPACE"
